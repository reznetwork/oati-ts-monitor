<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oati-ts-monitor · Historical Log Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #0b1419;
    --surface: #0f1b21;
    --surface2: #122029;
    --border: #1f2e35;
    --border-strong: #2a3d46;
    --text: #e7ecee;
    --muted: #5c7178;
    --secondary: #9fb6bd;
    --accent: #3fb6d8;
    --success: #7fcf8e;
    --danger: #e2615a;
    --warning: #e0b34d;
    --bar: #3fb6d8;
    --bar-selected: #6ee7b7;
    --playhead: #f59e0b;
    --splitter: #2a3d46;
    --header-h: 48px;
    --dash-pct: 50%;
    --main-pct: 62%;
    --label-w: 140px;
  }
  * , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }

  header.app-header {
    height: var(--header-h); display: flex; align-items: center; gap: 12px;
    padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 14px; font-weight: 600; color: var(--accent); white-space: nowrap; }
  header .meta { color: var(--secondary); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .meta strong { color: var(--text); font-weight: 600; }
  header a { color: var(--accent); text-decoration: none; font-size: 12px; margin-left: auto;
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; }
  header a:hover { background: var(--surface2); }

  .layout {
    height: calc(100% - var(--header-h));
    display: grid;
    grid-template-rows: minmax(120px, var(--main-pct)) 6px minmax(140px, 1fr);
  }
  .main-row {
    display: grid;
    grid-template-columns: minmax(180px, var(--dash-pct)) 6px minmax(180px, 1fr);
    min-height: 0; overflow: hidden;
  }
  .pane { min-height: 0; min-width: 0; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; }
  .pane-title {
    flex: 0 0 auto; padding: 8px 12px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); border-bottom: 1px solid var(--border);
    background: var(--surface); display: flex; align-items: center; gap: 8px;
  }
  .pane-body { flex: 1; min-height: 0; overflow: auto; padding: 12px; }
  #map-pane .pane-body { padding: 0; position: relative; }
  #map { width: 100%; height: 100%; background: #0a1216; }
  .map-layers {
    display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto;
    text-transform: none; letter-spacing: 0; font-size: 11px; color: var(--secondary);
  }
  .map-layers label {
    display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
    user-select: none;
  }
  .map-layers input { accent-color: var(--accent); }
  .map-legend {
    position: absolute; left: 10px; bottom: 10px; z-index: 500;
    background: rgba(15, 27, 33, 0.92); border: 1px solid var(--border-strong);
    border-radius: 8px; padding: 8px 10px; font-size: 11px; color: var(--text);
    pointer-events: none; min-width: 148px;
  }
  .map-legend h4 {
    font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin-bottom: 6px; font-weight: 600;
  }
  .map-legend-row {
    display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--secondary);
  }
  .map-legend-swatch {
    width: 18px; height: 4px; border-radius: 2px; flex: 0 0 auto;
  }
  .tl-transport {
    display: inline-flex; align-items: center; gap: 4px;
    margin-left: 8px; padding-left: 8px; border-left: 1px solid var(--border);
  }
  .tl-transport button.active {
    border-color: var(--accent); color: var(--accent); background: rgba(63,182,216,.12);
  }

  .splitter-h, .splitter-v {
    background: var(--splitter); position: relative; z-index: 5;
  }
  .splitter-h { cursor: col-resize; }
  .splitter-v { cursor: row-resize; }
  .splitter-h:hover, .splitter-v:hover, .splitter-h.active, .splitter-v.active {
    background: var(--accent);
  }

  .tabs { display: flex; gap: 4px; margin-left: auto; }
  .tab-btn {
    background: none; border: none; color: var(--secondary); font-size: 11px;
    padding: 2px 8px; border-radius: 4px; cursor: pointer; text-transform: none; letter-spacing: 0;
  }
  .tab-btn.active { background: var(--surface2); color: var(--text); }

  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px;
  }
  .card h3 { font-size: 12px; margin-bottom: 8px; }
  .detail-row { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,.04); font-size: 12px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { color: var(--secondary); }
  .detail-value { font-weight: 500; text-align: right; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .pill {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 8px; font-size: 11px; color: var(--secondary);
  }
  .points { list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .point-row {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px;
  }
  .point-on { color: var(--success); }
  .point-off { color: var(--muted); }
  .ctrl-block { margin-bottom: 14px; }
  .ctrl-block h4 { font-size: 12px; color: var(--accent); margin-bottom: 6px; }
  .gears { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .gear {
    min-width: 36px; text-align: center; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--muted);
  }
  .gear.active { border-color: var(--accent); color: var(--text); background: var(--surface2); }
  .empty-msg { color: var(--muted); font-style: italic; padding: 20px; text-align: center; }

  /* Timeline */
  #timeline-pane { display: flex; flex-direction: column; background: var(--surface); border-top: 1px solid var(--border); }
  .tl-toolbar {
    flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid var(--border);
  }
  .tl-toolbar button {
    background: var(--surface2); border: 1px solid var(--border-strong); color: var(--text);
    border-radius: 5px; padding: 4px 10px; cursor: pointer; font-size: 12px;
  }
  .tl-toolbar button:hover { border-color: var(--accent); }
  .tl-toolbar .range { font-family: ui-monospace, monospace; font-size: 11px; color: var(--secondary); }
  .tl-toolbar .tl-date-wrap {
    display: inline-flex; align-items: center; gap: 6px; margin-left: 4px;
    color: var(--secondary); font-size: 12px;
  }
  .tl-toolbar input[type="date"] {
    background: var(--surface2); border: 1px solid var(--border-strong); color: var(--text);
    border-radius: 5px; padding: 3px 8px; font-size: 12px; color-scheme: dark;
  }
  .tl-toolbar input[type="date"]:hover { border-color: var(--accent); }
  .tl-body { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--label-w) 4px 1fr; }
  .tl-label-split { cursor: col-resize; background: var(--splitter); }
  .tl-label-split:hover { background: var(--accent); }
  .tl-labels-col {
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    background: var(--surface2); border-right: 1px solid var(--border);
  }
  .tl-labels-head {
    flex: 0 0 24px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .tl-labels {
    flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto;
    scrollbar-width: none;
  }
  .tl-labels::-webkit-scrollbar { width: 0; height: 0; }
  .tl-label-row {
    height: 28px; display: flex; align-items: center; padding: 0 10px;
    border-bottom: 1px solid var(--border); font-size: 12px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tl-label-row:hover { background: var(--surface); }
  .tl-label-row.selected { color: var(--bar-selected); font-weight: 600; background: rgba(110,231,183,.08); }
  .tl-canvas-wrap { position: relative; overflow: hidden; background: var(--bg); cursor: grab; }
  .tl-canvas-wrap.panning { cursor: grabbing; user-select: none; }
  .tl-axis {
    position: absolute; top: 0; left: 0; right: 0; height: 24px;
    border-bottom: 1px solid var(--border); background: var(--surface);
    pointer-events: none; z-index: 2; overflow: hidden;
  }
  .tl-axis-tick {
    position: absolute; top: 0; height: 100%;
    border-left: 1px solid rgba(255, 255, 255, 0.09);
    font-size: 10px; color: var(--muted); padding: 4px 0 0 4px; white-space: nowrap;
  }
  .tl-grid {
    position: absolute; top: 24px; left: 0; right: 0; bottom: 0;
    pointer-events: none; z-index: 0; overflow: hidden;
  }
  .tl-weekend {
    position: absolute; top: 0; bottom: 0;
    background: rgba(120, 145, 190, 0.07);
  }
  .tl-work-hours {
    position: absolute; top: 0; bottom: 0;
    background: rgba(255, 255, 255, 0.04);
  }
  .tl-day-div {
    position: absolute; top: 0; bottom: 0; width: 1px;
    background: rgba(255, 255, 255, 0.09);
  }
  .tl-rows {
    position: absolute; top: 24px; left: 0; right: 0; bottom: 0;
    overflow-x: hidden; overflow-y: auto; z-index: 1;
  }
  .tl-row {
    position: relative; height: 28px; border-bottom: 1px solid rgba(255,255,255,.04); cursor: pointer;
  }
  .tl-row.selected { background: rgba(110,231,183,.06); }
  .tl-bar {
    position: absolute; top: 6px; height: 16px; border-radius: 3px;
    background: var(--bar); opacity: .85; cursor: pointer;
  }
  .tl-row.selected .tl-bar { background: var(--bar-selected); }
  .tl-playhead {
    position: absolute; top: 0; bottom: 0; width: 2px; background: var(--playhead);
    z-index: 4; pointer-events: none; box-shadow: 0 0 6px rgba(245,158,11,.5);
  }
  .tl-playhead::before {
    content: ""; position: absolute; top: 0; left: -5px;
    border-left: 6px solid transparent; border-right: 6px solid transparent;
    border-top: 8px solid var(--playhead);
  }
</style>
</head>
<body>
<header class="app-header">
  <h1>Historical Log Viewer</h1>
  <div class="meta" id="header-meta">Loading…</div>
  <a href="/">Ops dashboard</a>
</header>

<div class="layout" id="layout">
  <div class="main-row" id="main-row">
    <section class="pane" id="dash-pane">
      <div class="pane-title">
        Dashboard replay
        <div class="tabs">
          <button class="tab-btn active" data-tab="overview">Overview</button>
          <button class="tab-btn" data-tab="inputs">Inputs</button>
        </div>
      </div>
      <div class="pane-body" id="dash-body">
        <div class="empty-msg">Select a vehicle on the timeline</div>
      </div>
    </section>
    <div class="splitter-h" id="split-h" title="Drag to resize"></div>
    <section class="pane" id="map-pane">
      <div class="pane-title">
        WiFi map
        <div class="map-layers" title="Map layers">
          <label><input type="checkbox" id="layer-path" checked> Path</label>
          <label><input type="checkbox" id="layer-roam" checked> Roaming</label>
          <label><input type="checkbox" id="layer-playhead" checked> Playhead</label>
        </div>
      </div>
      <div class="pane-body">
        <div id="map"></div>
        <div class="map-legend" id="map-legend" aria-hidden="true">
          <h4>RSSI</h4>
          <div class="map-legend-row"><span class="map-legend-swatch" style="background:#22c55e"></span>−40 … −68 dBm</div>
          <div class="map-legend-row"><span class="map-legend-swatch" style="background:#eab308"></span>−68 … −77 dBm</div>
          <div class="map-legend-row"><span class="map-legend-swatch" style="background:#ef4444"></span>≤ −77 dBm</div>
        </div>
      </div>
    </section>
  </div>
  <div class="splitter-v" id="split-v" title="Drag to resize"></div>
  <section id="timeline-pane">
    <div class="tl-toolbar">
      <button type="button" id="btn-pan-left">← Pan</button>
      <button type="button" id="btn-pan-right">Pan →</button>
      <button type="button" id="btn-zoom-out">Zoom −</button>
      <button type="button" id="btn-zoom-in">Zoom +</button>
      <label class="tl-date-wrap" title="Jump to date">
        <span>Date</span>
        <input type="date" id="tl-date">
      </label>
      <div class="tl-transport" role="group" aria-label="Playhead controls">
        <button type="button" id="btn-prev-bar" title="Previous bar">I&lt;</button>
        <button type="button" id="btn-rev" title="Reverse play">&lt;</button>
        <button type="button" id="btn-prev-ev" title="Previous event">&lt;I</button>
        <button type="button" id="btn-pause" title="Pause">II</button>
        <button type="button" id="btn-next-ev" title="Next event">I&gt;</button>
        <button type="button" id="btn-play" title="Play">&gt;</button>
        <button type="button" id="btn-next-bar" title="Next bar">&gt;I</button>
      </div>
      <span class="range" id="tl-range">—</span>
    </div>
    <div class="tl-body">
      <div class="tl-labels-col">
        <div class="tl-labels-head" aria-hidden="true"></div>
        <div class="tl-labels" id="tl-labels"></div>
      </div>
      <div class="tl-label-split" id="split-label" title="Drag to resize labels"></div>
      <div class="tl-canvas-wrap" id="tl-canvas-wrap">
        <div class="tl-axis" id="tl-axis"></div>
        <div class="tl-grid" id="tl-grid"></div>
        <div class="tl-rows" id="tl-rows"></div>
        <div class="tl-playhead" id="tl-playhead"></div>
      </div>
    </div>
  </section>
</div>

<script>
(function () {
  const LS = {
    dash: 'oati.viewer.dashPct',
    main: 'oati.viewer.mainPct',
    label: 'oati.viewer.labelW',
  };

  const state = {
    vehicles: [],
    selected: null,
    playheadMs: null,
    viewFrom: null,
    viewTo: null,
    globalFrom: null,
    globalTo: null,
    bars: [],
    activityGapMs: 120000,
    vehicleOrder: [],
    slice: null,
    track: null,
    dashTab: 'overview',
    map: null,
    pathLayer: null,
    roamLayer: null,
    marker: null,
    layers: { path: true, roam: true, playhead: true },
    playback: { dir: 0, raf: null, lastWall: null, lastFetch: 0 },
  };

  function $(id) { return document.getElementById(id); }

  function fmtTs(ms) {
    if (ms == null || !Number.isFinite(ms)) return '—';
    const d = new Date(ms);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} `
      + `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3,'0')}`;
  }

  function fmtAxis(ms, stepMs) {
    const d = new Date(ms);
    const p = (n) => String(n).padStart(2, '0');
    if (stepMs >= 86400000) {
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }
    if (stepMs >= 3600000) {
      return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:00`;
    }
    return `${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function axisStepMs(span, width) {
    const target = Math.max(4, Math.min(12, Math.floor(width / 110)));
    const candidates = [
      60000, 5 * 60000, 15 * 60000, 30 * 60000,
      3600000, 2 * 3600000, 3 * 3600000, 6 * 3600000, 12 * 3600000,
      86400000, 7 * 86400000,
    ];
    let best = candidates[candidates.length - 1];
    for (const c of candidates) {
      if (span / c <= target + 1) {
        best = c;
        break;
      }
    }
    return best;
  }

  function alignTickStart(ms, stepMs) {
    const d = new Date(ms);
    if (stepMs >= 7 * 86400000) {
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() - d.getDay());
      return d.getTime();
    }
    if (stepMs >= 86400000) {
      d.setHours(0, 0, 0, 0);
      return d.getTime();
    }
    if (stepMs >= 3600000) {
      d.setMinutes(0, 0, 0);
      const hours = stepMs / 3600000;
      d.setHours(Math.floor(d.getHours() / hours) * hours);
      return d.getTime();
    }
    d.setSeconds(0, 0);
    const mins = stepMs / 60000;
    d.setMinutes(Math.floor(d.getMinutes() / mins) * mins);
    return d.getTime();
  }

  function eachAxisTick(viewFrom, viewTo, width, fn) {
    const span = viewTo - viewFrom;
    if (span <= 0) return;
    const step = axisStepMs(span, width);
    let t = alignTickStart(viewFrom, step);
    while (t + step <= viewFrom) t += step;
    const maxTicks = 48;
    let n = 0;
    while (t <= viewTo + 1 && n < maxTicks) {
      fn(t, step);
      t += step;
      n += 1;
    }
  }

  async function fetchJSON(url) {
    const r = await fetch(url);
    if (!r.ok) {
      const t = await r.text();
      throw new Error(t || r.statusText);
    }
    return r.json();
  }

  function loadLayout() {
    const dash = parseFloat(localStorage.getItem(LS.dash));
    const main = parseFloat(localStorage.getItem(LS.main));
    const label = parseFloat(localStorage.getItem(LS.label));
    if (Number.isFinite(dash)) document.documentElement.style.setProperty('--dash-pct', dash + '%');
    if (Number.isFinite(main)) document.documentElement.style.setProperty('--main-pct', main + '%');
    if (Number.isFinite(label)) document.documentElement.style.setProperty('--label-w', label + 'px');
  }

  function saveLayout() {
    const dash = getComputedStyle(document.documentElement).getPropertyValue('--dash-pct').trim().replace('%','');
    const main = getComputedStyle(document.documentElement).getPropertyValue('--main-pct').trim().replace('%','');
    const lw = getComputedStyle(document.documentElement).getPropertyValue('--label-w').trim().replace('px','');
    localStorage.setItem(LS.dash, dash);
    localStorage.setItem(LS.main, main);
    localStorage.setItem(LS.label, lw);
  }

  function setupSplitters() {
    function drag(el, onMove) {
      el.addEventListener('mousedown', (e) => {
        e.preventDefault();
        el.classList.add('active');
        const move = (ev) => onMove(ev);
        const up = () => {
          el.classList.remove('active');
          document.removeEventListener('mousemove', move);
          document.removeEventListener('mouseup', up);
          saveLayout();
          invalidateMap();
          renderTimeline();
        };
        document.addEventListener('mousemove', move);
        document.addEventListener('mouseup', up);
      });
    }

    drag($('split-h'), (ev) => {
      const row = $('main-row').getBoundingClientRect();
      const pct = ((ev.clientX - row.left) / row.width) * 100;
      document.documentElement.style.setProperty('--dash-pct', Math.min(80, Math.max(20, pct)) + '%');
    });

    drag($('split-v'), (ev) => {
      const layout = $('layout').getBoundingClientRect();
      const pct = ((ev.clientY - layout.top) / layout.height) * 100;
      document.documentElement.style.setProperty('--main-pct', Math.min(85, Math.max(25, pct)) + '%');
    });

    drag($('split-label'), (ev) => {
      const body = document.querySelector('.tl-body').getBoundingClientRect();
      const w = Math.min(280, Math.max(80, ev.clientX - body.left));
      document.documentElement.style.setProperty('--label-w', w + 'px');
    });
  }

  function updateHeader() {
    const sel = state.selected || '—';
    $('header-meta').innerHTML =
      `Selected: <strong>${sel}</strong> · Playhead: <strong>${fmtTs(state.playheadMs)}</strong>`;
  }

  function rssiColor(dbm) {
    if (dbm == null || !Number.isFinite(dbm)) return '#64748b';
    if (dbm >= -68) return '#22c55e';
    if (dbm >= -77) return '#eab308';
    return '#ef4444';
  }

  function initMap() {
    state.map = L.map('map', { zoomControl: true }).setView([55.75, 37.62], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap',
    }).addTo(state.map);
    state.pathLayer = L.layerGroup();
    state.roamLayer = L.layerGroup();
    if (state.layers.path) state.pathLayer.addTo(state.map);
    if (state.layers.roam) state.roamLayer.addTo(state.map);
    setupMapLayers();
  }

  function setupMapLayers() {
    const path = $('layer-path');
    const roam = $('layer-roam');
    const playhead = $('layer-playhead');
    if (!path || !roam || !playhead) return;
    path.checked = state.layers.path;
    roam.checked = state.layers.roam;
    playhead.checked = state.layers.playhead;
    path.addEventListener('change', () => {
      state.layers.path = path.checked;
      if (path.checked) state.pathLayer.addTo(state.map);
      else state.map.removeLayer(state.pathLayer);
      const legend = $('map-legend');
      if (legend) legend.style.display = path.checked ? '' : 'none';
    });
    roam.addEventListener('change', () => {
      state.layers.roam = roam.checked;
      if (roam.checked) state.roamLayer.addTo(state.map);
      else state.map.removeLayer(state.roamLayer);
    });
    playhead.addEventListener('change', () => {
      state.layers.playhead = playhead.checked;
      updatePlayheadMarker();
    });
  }

  function invalidateMap() {
    if (state.map) setTimeout(() => state.map.invalidateSize(), 50);
  }

  function selectedBars() {
    if (!state.selected) return [];
    return state.bars
      .filter(b => b.vehicle_short === state.selected)
      .map(b => ({
        from: b.raw_from_ms != null ? b.raw_from_ms : b.from_ms,
        to: b.raw_to_ms != null ? b.raw_to_ms : b.to_ms,
      }))
      .filter(b => Number.isFinite(b.from) && Number.isFinite(b.to) && b.to >= b.from)
      .sort((a, b) => a.from - b.from);
  }

  function barContaining(ms) {
    const bars = selectedBars();
    for (const b of bars) {
      if (ms >= b.from && ms <= b.to) return b;
    }
    return null;
  }

  function samplesShareBar(aTs, bTs) {
    const bars = selectedBars();
    if (bars.length) {
      for (const bar of bars) {
        if (aTs >= bar.from && aTs <= bar.to && bTs >= bar.from && bTs <= bar.to) {
          return true;
        }
      }
      return false;
    }
    return Math.abs(bTs - aTs) <= state.activityGapMs;
  }

  function renderTrack() {
    state.pathLayer.clearLayers();
    state.roamLayer.clearLayers();
    if (state.marker) { state.map.removeLayer(state.marker); state.marker = null; }
    const samples = (state.track && state.track.samples) || [];
    const roaming = (state.track && state.track.roaming) || [];
    if (!samples.length) {
      updatePlayheadMarker();
      invalidateMap();
      return;
    }
    for (let i = 1; i < samples.length; i++) {
      const a = samples[i - 1], b = samples[i];
      if (!samplesShareBar(a.ts_ms, b.ts_ms)) continue;
      L.polyline([[a.lat, a.lon], [b.lat, b.lon]], {
        color: rssiColor(a.rssi_dbm), weight: 4, opacity: 0.9,
      }).addTo(state.pathLayer);
    }
    for (const r of roaming) {
      L.circleMarker([r.lat, r.lon], {
        radius: 6, color: '#f59e0b', fillColor: '#f59e0b', fillOpacity: 0.9, weight: 1,
      }).bindTooltip(`${r.event || 'roam'} @ ${fmtTs(r.ts_ms)}`).addTo(state.roamLayer);
    }
    updatePlayheadMarker();
    const bounds = L.latLngBounds(samples.map(s => [s.lat, s.lon]));
    if (bounds.isValid()) state.map.fitBounds(bounds.pad(0.15));
    invalidateMap();
  }

  function updatePlayheadMarker() {
    if (state.marker) {
      state.map.removeLayer(state.marker);
      state.marker = null;
    }
    if (!state.layers.playhead) return;
    if (!state.map || !state.track || !state.track.samples.length || state.playheadMs == null) return;
    let best = state.track.samples[0];
    let bestDist = Math.abs(best.ts_ms - state.playheadMs);
    for (const s of state.track.samples) {
      const d = Math.abs(s.ts_ms - state.playheadMs);
      if (d < bestDist) { best = s; bestDist = d; }
    }
    state.marker = L.circleMarker([best.lat, best.lon], {
      radius: 8, color: '#fff', fillColor: '#f59e0b', fillOpacity: 1, weight: 2,
    }).bindTooltip(`playhead ${fmtTs(state.playheadMs)}`).addTo(state.map);
  }

  function trackEvents() {
    const samples = (state.track && state.track.samples) || [];
    const roaming = (state.track && state.track.roaming) || [];
    const bar = state.playheadMs != null ? barContaining(state.playheadMs) : null;
    const events = [];
    for (const s of samples) {
      if (bar && (s.ts_ms < bar.from || s.ts_ms > bar.to)) continue;
      events.push({ ts_ms: s.ts_ms, kind: 'sample' });
    }
    for (const r of roaming) {
      if (bar && (r.ts_ms < bar.from || r.ts_ms > bar.to)) continue;
      events.push({ ts_ms: r.ts_ms, kind: 'roam' });
    }
    events.sort((a, b) => a.ts_ms - b.ts_ms);
    return events;
  }

  function updateTransportButtons() {
    const dir = state.playback.dir;
    const play = $('btn-play');
    const rev = $('btn-rev');
    if (play) play.classList.toggle('active', dir > 0);
    if (rev) rev.classList.toggle('active', dir < 0);
  }

  function stopPlayback() {
    state.playback.dir = 0;
    state.playback.lastWall = null;
    if (state.playback.raf != null) {
      cancelAnimationFrame(state.playback.raf);
      state.playback.raf = null;
    }
    updateTransportButtons();
  }

  async function setPlayheadMs(ms, { fetchSlice = true, reloadTrack = false } = {}) {
    state.playheadMs = Math.round(ms);
    updateHeader();
    positionPlayhead();
    updatePlayheadMarker();
    const jobs = [];
    if (reloadTrack) jobs.push(loadTrack());
    if (fetchSlice) jobs.push(loadSlice());
    if (jobs.length) await Promise.all(jobs);
  }

  function startPlayback(dir) {
    if (!state.selected || state.playheadMs == null) return;
    stopPlayback();
    state.playback.dir = dir;
    state.playback.lastWall = null;
    state.playback.lastFetch = 0;
    updateTransportButtons();
    const tick = (now) => {
      if (!state.playback.dir) return;
      if (state.playback.lastWall == null) state.playback.lastWall = now;
      const dt = now - state.playback.lastWall;
      state.playback.lastWall = now;
      let next = state.playheadMs + state.playback.dir * dt;
      const bar = barContaining(state.playheadMs) || barContaining(next);
      if (bar) {
        if (next > bar.to) {
          next = bar.to;
          state.playheadMs = Math.round(next);
          updateHeader();
          positionPlayhead();
          updatePlayheadMarker();
          stopPlayback();
          loadSlice();
          return;
        }
        if (next < bar.from) {
          next = bar.from;
          state.playheadMs = Math.round(next);
          updateHeader();
          positionPlayhead();
          updatePlayheadMarker();
          stopPlayback();
          loadSlice();
          return;
        }
      }
      state.playheadMs = Math.round(next);
      updateHeader();
      positionPlayhead();
      updatePlayheadMarker();
      if (now - state.playback.lastFetch > 250) {
        state.playback.lastFetch = now;
        loadSlice();
      }
      state.playback.raf = requestAnimationFrame(tick);
    };
    state.playback.raf = requestAnimationFrame(tick);
  }

  async function jumpPrevNextEvent(dir) {
    stopPlayback();
    const events = trackEvents();
    if (!events.length || state.playheadMs == null) return;
    let target = null;
    if (dir > 0) {
      for (const e of events) {
        if (e.ts_ms > state.playheadMs) { target = e.ts_ms; break; }
      }
    } else {
      for (let i = events.length - 1; i >= 0; i--) {
        if (events[i].ts_ms < state.playheadMs) { target = events[i].ts_ms; break; }
      }
    }
    if (target == null) return;
    await setPlayheadMs(target, { fetchSlice: true });
  }

  async function jumpPrevNextBar(dir) {
    stopPlayback();
    const bars = selectedBars();
    if (!bars.length || state.playheadMs == null) return;
    let idx = bars.findIndex(b => state.playheadMs >= b.from && state.playheadMs <= b.to);
    let target;
    if (idx >= 0) {
      const nextIdx = idx + dir;
      if (nextIdx < 0 || nextIdx >= bars.length) return;
      target = bars[nextIdx];
    } else if (dir > 0) {
      target = bars.find(b => b.from > state.playheadMs);
      if (!target) return;
    } else {
      for (let i = bars.length - 1; i >= 0; i--) {
        if (bars[i].to < state.playheadMs) { target = bars[i]; break; }
      }
      if (!target) return;
    }
    const mid = target.from + (target.to - target.from) / 2;
    if (state.viewFrom != null && (mid < state.viewFrom || mid > state.viewTo)) {
      const span = Math.max(1000, state.viewTo - state.viewFrom);
      state.viewFrom = mid - span / 2;
      state.viewTo = mid + span / 2;
      await refreshActivity();
    }
    await setPlayheadMs(mid, { fetchSlice: true, reloadTrack: true });
  }

  function setupTransport() {
    $('btn-prev-bar').onclick = () => jumpPrevNextBar(-1);
    $('btn-next-bar').onclick = () => jumpPrevNextBar(1);
    $('btn-prev-ev').onclick = () => jumpPrevNextEvent(-1);
    $('btn-next-ev').onclick = () => jumpPrevNextEvent(1);
    $('btn-play').onclick = () => startPlayback(1);
    $('btn-rev').onclick = () => startPlayback(-1);
    $('btn-pause').onclick = () => {
      stopPlayback();
      if (state.selected) loadSlice();
    };
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function renderDashboard() {
    const body = $('dash-body');
    if (!state.slice || !state.slice.found) {
      body.innerHTML = `<div class="empty-msg">${state.selected
        ? 'No snapshot at/before playhead for this vehicle'
        : 'Select a vehicle on the timeline'}</div>`;
      return;
    }
    const data = state.slice.data || {};
    const gnss = data.gnss || {};
    const wifi = data.wifi || {};
    const controllers = data.controllers || {};

    const pills = [];
    if (data.display_latency && data.display_latency.gateway_ms != null) {
      pills.push(`Gateway ${Number(data.display_latency.gateway_ms).toFixed(0)} ms`);
    }
    for (const [name, c] of Object.entries(controllers)) {
      const st = c.status || '—';
      const lat = c.latency != null ? `${Number(c.latency).toFixed(0)} ms` : '—';
      pills.push(`${name}: ${st} / ${lat}`);
    }
    pills.push(`GNSS ${gnss.fix || '—'}`);
    pills.push(`WiFi ${wifi.ssid || '—'} ${wifi.signal_dbm != null ? wifi.signal_dbm + ' dBm' : (wifi.signal || '')}`);

    const overview = `
      <div class="pills">${pills.map(p => `<span class="pill">${esc(p)}</span>`).join('')}</div>
      <div class="grid-2">
        <div class="card"><h3>GNSS</h3>
          ${[
            ['Fix', gnss.fix], ['Solution', gnss.solution_level],
            ['Sats', gnss.sats ?? gnss.num_sats], ['HDOP', gnss.hdop],
            ['Lat', gnss.lat], ['Lon', gnss.lon],
          ].map(([l,v]) => `<div class="detail-row"><span class="detail-label">${esc(l)}</span>
            <span class="detail-value">${esc(v ?? '—')}</span></div>`).join('')}
        </div>
        <div class="card"><h3>WiFi</h3>
          ${[
            ['Status', wifi.status], ['SSID', wifi.ssid], ['BSSID', wifi.bssid],
            ['Signal', wifi.signal_dbm != null ? wifi.signal_dbm + ' dBm' : wifi.signal],
            ['Freq', wifi.freq || wifi.frequency],
            ['BSSID change', wifi.bssid_change_ms != null ? wifi.bssid_change_ms + ' ms ago' : null],
          ].map(([l,v]) => `<div class="detail-row"><span class="detail-label">${esc(l)}</span>
            <span class="detail-value">${esc(v ?? '—')}</span></div>`).join('')}
        </div>
      </div>
      <div class="card" style="margin-top:10px"><h3>Slice</h3>
        <div class="detail-row"><span class="detail-label">Snapshot ts</span>
          <span class="detail-value">${esc(fmtTs(state.slice.ts_ms))}</span></div>
        <div class="detail-row"><span class="detail-label">Segment</span>
          <span class="detail-value">${esc(state.slice.segment)}</span></div>
      </div>`;

    let inputs = '';
    for (const [name, c] of Object.entries(controllers)) {
      const points = c.points || {};
      const meta = c.points_meta || {};
      const gears = c.gears || {};
      const extra = c.extra || {};
      const rows = Object.keys(points).sort((a,b)=>Number(a)-Number(b)).map(addr => {
        const on = !!points[addr];
        const label = (meta[addr] && (meta[addr].label || meta[addr].name)) || `DI ${addr}`;
        return `<li class="point-row"><span>${esc(label)}</span>
          <span class="${on?'point-on':'point-off'}">${on?'ON':'OFF'}</span></li>`;
      }).join('');
      const gearHtml = Object.entries(gears).map(([g, on]) =>
        `<div class="gear ${on?'active':''}">${esc(g)}</div>`).join('');
      const extraRows = Object.entries(extra).map(([k,v]) =>
        `<li class="point-row"><span>${esc(k)}</span><span>${esc(v)}</span></li>`).join('');
      inputs += `<div class="ctrl-block"><h4>${esc(name)}</h4>
        <ul class="points">${rows || '<li class="empty-msg">No points</li>'}</ul>
        ${gearHtml ? `<div class="gears">${gearHtml}</div>` : ''}
        ${extraRows ? `<ul class="points" style="margin-top:6px">${extraRows}</ul>` : ''}
      </div>`;
    }
    if (!inputs) inputs = '<div class="empty-msg">No controller data in this snapshot</div>';

    body.innerHTML = state.dashTab === 'inputs' ? inputs : overview;
  }

  function msToX(ms, width) {
    const span = state.viewTo - state.viewFrom;
    if (span <= 0) return 0;
    return ((ms - state.viewFrom) / span) * width;
  }

  function xToMs(x, width) {
    const span = state.viewTo - state.viewFrom;
    return state.viewFrom + (x / width) * span;
  }

  function toDateInputValue(ms) {
    const d = new Date(ms);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }

  function syncDateInput() {
    const el = $('tl-date');
    if (!el || state.viewFrom == null) return;
    const mid = (state.viewFrom + state.viewTo) / 2;
    el.value = toDateInputValue(mid);
    if (state.globalFrom != null) el.min = toDateInputValue(state.globalFrom);
    if (state.globalTo != null) el.max = toDateInputValue(state.globalTo);
  }

  function renderDayGrid(width) {
    const grid = $('tl-grid');
    grid.innerHTML = '';
    if (state.viewFrom == null || state.viewTo == null || state.viewTo <= state.viewFrom) return;

    const start = new Date(state.viewFrom);
    start.setHours(0, 0, 0, 0);
    let dayStart = start.getTime();
    if (dayStart > state.viewFrom) dayStart -= 86400000;

    const maxDays = 400;
    let n = 0;
    while (dayStart < state.viewTo && n < maxDays) {
      const dayEnd = dayStart + 86400000;
      const day = new Date(dayStart);
      const dow = day.getDay();
      const isWeekend = dow === 0 || dow === 6;
      const left = msToX(dayStart, width);
      const right = msToX(dayEnd, width);
      const colLeft = Math.max(0, left);
      const colRight = Math.min(width, right);

      if (colRight > colLeft) {
        if (isWeekend) {
          const we = document.createElement('div');
          we.className = 'tl-weekend';
          we.style.left = colLeft + 'px';
          we.style.width = (colRight - colLeft) + 'px';
          grid.appendChild(we);
        }

        const whFrom = dayStart + 7 * 3600000;
        const whTo = dayStart + 19 * 3600000;
        const wLeft = Math.max(colLeft, msToX(whFrom, width));
        const wRight = Math.min(colRight, msToX(whTo, width));
        if (wRight > wLeft) {
          const wh = document.createElement('div');
          wh.className = 'tl-work-hours';
          wh.style.left = wLeft + 'px';
          wh.style.width = (wRight - wLeft) + 'px';
          grid.appendChild(wh);
        }
      }

      if (dayStart >= state.viewFrom - 1 && dayStart <= state.viewTo + 1) {
        const x = msToX(dayStart, width);
        if (x >= -1 && x <= width + 1) {
          const div = document.createElement('div');
          div.className = 'tl-day-div';
          div.style.left = x + 'px';
          grid.appendChild(div);
        }
      }

      dayStart = dayEnd;
      n += 1;
    }
  }

  function renderTimeline() {
    const wrap = $('tl-canvas-wrap');
    const width = wrap.clientWidth || 1;
    const labels = $('tl-labels');
    const rowsEl = $('tl-rows');
    const axis = $('tl-axis');

    labels.innerHTML = '';
    rowsEl.innerHTML = '';
    axis.innerHTML = '';
    renderDayGrid(width);

    const order = state.vehicleOrder.length
      ? state.vehicleOrder
      : [...new Set(state.bars.map(b => b.vehicle_short))].sort();

    for (const vs of order) {
      const lab = document.createElement('div');
      lab.className = 'tl-label-row' + (vs === state.selected ? ' selected' : '');
      lab.textContent = vs;
      lab.title = vs;
      lab.addEventListener('click', () => selectVehicle(vs));
      labels.appendChild(lab);

      const row = document.createElement('div');
      row.className = 'tl-row' + (vs === state.selected ? ' selected' : '');
      row.dataset.vehicle = vs;
      for (const bar of state.bars.filter(b => b.vehicle_short === vs)) {
        const left = msToX(bar.from_ms, width);
        const right = msToX(bar.to_ms, width);
        const clippedLeft = Math.max(0, left);
        const clippedRight = Math.min(width, right);
        if (clippedRight <= clippedLeft) continue;
        let barW = Math.max(2, clippedRight - clippedLeft);
        if (clippedLeft + barW > width) barW = width - clippedLeft;
        if (barW <= 0) continue;
        const el = document.createElement('div');
        el.className = 'tl-bar';
        el.style.left = clippedLeft + 'px';
        el.style.width = barW + 'px';
        el.title = `${vs}\n${fmtTs(bar.raw_from_ms || bar.from_ms)} → ${fmtTs(bar.raw_to_ms || bar.to_ms)}`;
        row.appendChild(el);
      }
      rowsEl.appendChild(row);
    }

    eachAxisTick(state.viewFrom, state.viewTo, width, (ms, step) => {
      const x = msToX(ms, width);
      if (x < -2 || x > width + 2) return;
      const tick = document.createElement('div');
      tick.className = 'tl-axis-tick';
      tick.style.left = x + 'px';
      tick.textContent = fmtAxis(ms, step);
      axis.appendChild(tick);
    });

    $('tl-range').textContent =
      `${fmtTs(state.viewFrom)}  …  ${fmtTs(state.viewTo)}`;
    syncDateInput();

    positionPlayhead();
  }

  function positionPlayhead() {
    const wrap = $('tl-canvas-wrap');
    const width = wrap.clientWidth || 1;
    const ph = $('tl-playhead');
    if (state.playheadMs == null || state.viewFrom == null) {
      ph.style.display = 'none';
      return;
    }
    ph.style.display = 'block';
    ph.style.left = msToX(state.playheadMs, width) + 'px';
  }

  async function selectVehicle(vs) {
    stopPlayback();
    if (state.selected !== vs) {
      state.selected = vs;
      updateHeader();
      renderTimeline();
      await Promise.all([loadSlice(), loadTrack()]);
    } else {
      updateHeader();
      renderTimeline();
    }
  }

  async function setPlayhead(ms, fetchData) {
    stopPlayback();
    await setPlayheadMs(ms, { fetchSlice: !!fetchData, reloadTrack: false });
  }

  async function loadVehicles() {
    const data = await fetchJSON('/api/vehicles');
    state.vehicles = data.vehicles || [];
    state.vehicleOrder = state.vehicles.map(v => v.vehicle_short);
    const todayStart = new Date();
    todayStart.setHours(0, 0, 0, 0);
    const todayFrom = todayStart.getTime();
    const todayTo = todayFrom + 86400000;
    const now = Date.now();
    if (!state.vehicles.length) {
      $('header-meta').textContent = 'No ingested logs in ClickHouse yet';
      state.viewFrom = todayFrom;
      state.viewTo = todayTo;
      state.globalFrom = todayFrom;
      state.globalTo = todayTo;
      state.playheadMs = now;
      renderTimeline();
      return;
    }
    state.globalFrom = Math.min(...state.vehicles.map(v => v.min_ts_ms));
    state.globalTo = Math.max(...state.vehicles.map(v => v.max_ts_ms));
    if (state.globalTo <= state.globalFrom) state.globalTo = state.globalFrom + 1;
    state.viewFrom = todayFrom;
    state.viewTo = todayTo;
    state.playheadMs = Math.min(Math.max(now, todayFrom), todayTo - 1);
    if (!state.selected) state.selected = state.vehicles[0].vehicle_short;
    updateHeader();
    await refreshActivity();
    await Promise.all([loadSlice(), loadTrack()]);
  }

  async function refreshActivity() {
    if (state.viewFrom == null) return;
    const pad = Math.max(1, state.viewTo - state.viewFrom) * 0.02;
    const data = await fetchJSON(
      `/api/activity?from_ms=${Math.floor(state.viewFrom - pad)}&to_ms=${Math.ceil(state.viewTo + pad)}`
    );
    state.bars = data.bars || [];
    if (Number.isFinite(data.gap_ms)) state.activityGapMs = data.gap_ms;
    const fromBars = new Set(state.bars.map(b => b.vehicle_short));
    for (const v of state.vehicles) fromBars.add(v.vehicle_short);
    if (!state.vehicleOrder.length) state.vehicleOrder = [...fromBars].sort();
    renderTimeline();
  }

  async function loadSlice() {
    if (!state.selected || state.playheadMs == null) {
      state.slice = null;
      renderDashboard();
      return;
    }
    try {
      state.slice = await fetchJSON(
        `/api/slice?vehicle_short=${encodeURIComponent(state.selected)}&ts_ms=${state.playheadMs}`
      );
    } catch (e) {
      state.slice = null;
      $('dash-body').innerHTML = `<div class="empty-msg">${esc(e.message)}</div>`;
      return;
    }
    renderDashboard();
  }

  function dayBoundsMs(ms) {
    const d = new Date(ms);
    d.setHours(0, 0, 0, 0);
    const from = d.getTime();
    return { from, to: from + 86400000 };
  }

  function trackQueryWindow() {
    const anchor = state.playheadMs != null
      ? state.playheadMs
      : (state.viewFrom != null && state.viewTo != null
        ? (state.viewFrom + state.viewTo) / 2
        : Date.now());
    const day = dayBoundsMs(anchor);
    let from = day.from;
    let to = day.to;
    // When zoomed into part of the day, only fetch the visible slice.
    if (state.viewFrom != null && state.viewTo != null) {
      const clippedFrom = Math.max(from, state.viewFrom);
      const clippedTo = Math.min(to, state.viewTo);
      if (clippedTo > clippedFrom) {
        from = clippedFrom;
        to = clippedTo;
      }
    }
    return { from, to };
  }

  async function loadTrack() {
    if (!state.selected || state.viewFrom == null) {
      state.track = { samples: [], roaming: [] };
      renderTrack();
      return;
    }
    const { from, to } = trackQueryWindow();
    try {
      state.track = await fetchJSON(
        `/api/track?vehicle_short=${encodeURIComponent(state.selected)}`
        + `&from_ms=${Math.floor(from)}&to_ms=${Math.ceil(to)}`
      );
    } catch (e) {
      state.track = { samples: [], roaming: [] };
    }
    renderTrack();
  }

  let viewAnimRaf = null;

  function animateViewTo(newFrom, newTo, duration) {
    duration = duration == null ? 220 : duration;
    if (viewAnimRaf != null) {
      cancelAnimationFrame(viewAnimRaf);
      viewAnimRaf = null;
    }
    const fromA = state.viewFrom;
    const toA = state.viewTo;
    if (!Number.isFinite(fromA) || !Number.isFinite(toA) || duration <= 0) {
      state.viewFrom = newFrom;
      state.viewTo = newTo;
      return refreshActivity().then(() => loadTrack());
    }
    const start = performance.now();
    return new Promise((resolve) => {
      const tick = (now) => {
        const t = Math.min(1, (now - start) / duration);
        const e = 1 - Math.pow(1 - t, 3);
        state.viewFrom = fromA + (newFrom - fromA) * e;
        state.viewTo = toA + (newTo - toA) * e;
        renderTimeline();
        if (t < 1) {
          viewAnimRaf = requestAnimationFrame(tick);
        } else {
          viewAnimRaf = null;
          state.viewFrom = newFrom;
          state.viewTo = newTo;
          refreshActivity().then(() => loadTrack()).then(resolve);
        }
      };
      viewAnimRaf = requestAnimationFrame(tick);
    });
  }

  function zoom(factor, centerMs) {
    const span = state.viewTo - state.viewFrom;
    const mid = centerMs != null ? centerMs : (state.viewFrom + state.viewTo) / 2;
    let newSpan = span / factor;
    const minSpan = 1000;
    const maxSpan = Math.max(minSpan, (state.globalTo - state.globalFrom) * 1.2);
    newSpan = Math.min(maxSpan, Math.max(minSpan, newSpan));
    animateViewTo(mid - newSpan / 2, mid + newSpan / 2);
  }

  function pan(dir) {
    const span = state.viewTo - state.viewFrom;
    const delta = span * 0.25 * dir;
    state.viewFrom += delta;
    state.viewTo += delta;
    refreshActivity().then(() => loadTrack());
  }

  function jumpToDate(dateStr) {
    if (!dateStr) return;
    stopPlayback();
    const parts = dateStr.split('-').map(Number);
    if (parts.length !== 3 || parts.some(n => !Number.isFinite(n))) return;
    const start = new Date(parts[0], parts[1] - 1, parts[2], 0, 0, 0, 0).getTime();
    const end = start + 86400000;
    const mid = start + 12 * 3600000;
    if (state.playheadMs == null || state.playheadMs < start || state.playheadMs >= end) {
      state.playheadMs = mid;
      updateHeader();
    }
    animateViewTo(start, end).then(() => {
      if (state.selected) return Promise.all([loadSlice(), loadTrack()]);
      return loadSlice();
    });
  }

  function setupTimelineInteractions() {
    const wrap = $('tl-canvas-wrap');
    let mode = null; // null | 'pending' | 'pan'
    let startX = 0;
    let lastX = 0;
    let clickMs = null;
    let clickVehicle = null;
    const DRAG_THRESH = 5;

    function vehicleFromEvent(e) {
      const row = e.target.closest && e.target.closest('.tl-row');
      return row ? row.dataset.vehicle : null;
    }

    wrap.addEventListener('mousedown', (e) => {
      if (e.button !== 0 && e.button !== 1) return;
      if (e.button === 1) e.preventDefault();
      const rect = wrap.getBoundingClientRect();
      mode = e.button === 1 ? 'pan' : 'pending';
      startX = e.clientX;
      lastX = e.clientX;
      clickMs = xToMs(e.clientX - rect.left, rect.width);
      clickVehicle = vehicleFromEvent(e);
      if (mode === 'pan') wrap.classList.add('panning');
    });

    document.addEventListener('mousemove', (e) => {
      if (!mode) return;
      const rect = wrap.getBoundingClientRect();
      if (mode === 'pending' && Math.abs(e.clientX - startX) >= DRAG_THRESH) {
        mode = 'pan';
        wrap.classList.add('panning');
      }
      if (mode === 'pan') {
        const dx = e.clientX - lastX;
        lastX = e.clientX;
        const span = state.viewTo - state.viewFrom;
        const dms = -(dx / rect.width) * span;
        state.viewFrom += dms;
        state.viewTo += dms;
        renderTimeline();
      }
    });

    document.addEventListener('mouseup', async () => {
      if (!mode) return;
      const wasPan = mode === 'pan';
      const wasClick = mode === 'pending';
      const vs = clickVehicle;
      const ms = clickMs;
      mode = null;
      wrap.classList.remove('panning');
      if (wasClick) {
        stopPlayback();
        if (vs) state.selected = vs;
        state.playheadMs = Math.round(ms);
        updateHeader();
        renderTimeline();
        if (state.selected) await Promise.all([loadSlice(), loadTrack()]);
        else await loadSlice();
      } else if (wasPan) {
        stopPlayback();
        await refreshActivity();
        await loadTrack();
      }
    });

    wrap.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = wrap.getBoundingClientRect();
      const center = xToMs(e.clientX - rect.left, rect.width);
      zoom(e.deltaY < 0 ? 1.25 : 0.8, center);
    }, { passive: false });

    $('btn-zoom-in').onclick = () => zoom(1.4, state.playheadMs);
    $('btn-zoom-out').onclick = () => zoom(0.7, state.playheadMs);
    $('btn-pan-left').onclick = () => pan(-1);
    $('btn-pan-right').onclick = () => pan(1);
    $('tl-date').addEventListener('change', (e) => jumpToDate(e.target.value));

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable)) {
        return;
      }
      e.preventDefault();
      pan(e.key === 'ArrowLeft' ? -1 : 1);
    });

    const rows = $('tl-rows');
    const labs = $('tl-labels');
    rows.addEventListener('scroll', () => { labs.scrollTop = rows.scrollTop; });
    labs.addEventListener('scroll', () => { rows.scrollTop = labs.scrollTop; });
  }

  function setupTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.dashTab = btn.dataset.tab;
        renderDashboard();
      });
    });
  }

  async function boot() {
    loadLayout();
    setupSplitters();
    setupTabs();
    initMap();
    setupTimelineInteractions();
    setupTransport();
    window.addEventListener('resize', () => {
      renderTimeline();
      invalidateMap();
    });
    try {
      await loadVehicles();
    } catch (e) {
      $('header-meta').textContent = 'ClickHouse API unavailable: ' + e.message;
      $('dash-body').innerHTML = `<div class="empty-msg">${esc(e.message)}<br>
        Start collector with --clickhouse and ensure ClickHouse is running.</div>`;
    }
  }

  boot();
})();
</script>
</body>
</html>
